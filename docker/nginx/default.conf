# ---------------------------------------------------------------------------
# Servidor de relatórios do pipeline S07.
#
# Serve o volume compartilhado `relatorios` (histórico, cobertura e relatório
# Playwright). Diferente da versão básica, aqui há: compressão, cabeçalhos de
# segurança, cache controlado por tipo de arquivo, MIME types de markdown,
# página de erro personalizada e log de acesso enxuto.
# ---------------------------------------------------------------------------

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/markdown application/json application/javascript image/svg+xml;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    charset utf-8;

    index  historico.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    access_log /var/log/nginx/relatorios.access.log;
    error_log  /var/log/nginx/relatorios.error.log warn;

    location ~* \.(html|md)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|zip|json|xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 "<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><title>S07 — Não encontrado</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#1f2937;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}main{text-align:center}a{color:#1d4ed8}</style></head><body><main><h1>404 — Arquivo não encontrado</h1><p><a href=\"/historico.html\">Voltar ao histórico de execuções</a></p></main></body></html>";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 503 "<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><title>S07 — Indisponível</title></head><body><h1>Serviço temporariamente indisponível</h1><p>Tente novamente em instantes.</p></body></html>";
    }
}