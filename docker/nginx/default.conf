server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  historico.html;

    charset utf-8;

    # Permite navegar pelos relatórios e pelo histórico de execuções
    # publicados no volume compartilhado `relatorios`.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
